<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-List</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS v3.4.1 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SortableJS v1.15.0 for Drag & Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA; /* Warna latar belakang yang lembut */
        }
        /* Styling untuk placeholder saat item di-drag */
        .sortable-ghost {
            background-color: #eef2ff;
            opacity: 0.7;
            border-bottom: 2px dashed #6366f1;
        }
        .sortable-drag {
            opacity: 0.9 !important;
            transform: rotate(1deg);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        /* Animasi fade in untuk notifikasi */
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(-20px); }
            10%, 90% { opacity: 1; transform: translateY(0); }
        }
        .toast-notification {
            animation: fadeInOut 4s ease-in-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen py-10">
    <div class="container mx-auto max-w-2xl p-4">
        
        <!-- Header -->
        <header class="flex items-center justify-center mb-8 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <h1 class="text-4xl font-bold text-slate-700 ml-4">Todo-List</h1>
        </header>

        <!-- Form Tambah/Edit Todo -->
        <form id="form-todo" class="mb-8 relative">
            <input type="text" id="todo-input" name="todo" class="w-full px-6 py-4 text-lg text-slate-700 bg-white border-2 border-transparent rounded-full focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all shadow-sm" placeholder="Tambahkan rencana baru..." />
            <button type="submit" id="submit-button" class="absolute right-2.5 top-1/2 -translate-y-1/2 bg-indigo-600 text-white w-11 h-11 rounded-full font-semibold hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500/50 transition-all duration-200 flex items-center justify-center shadow hover:shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </form>

        <!-- Filter dan Pencarian -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
            <div id="filter-buttons" class="flex items-center bg-white p-1 rounded-full shadow-sm">
                <button data-filter="all" class="filter-btn bg-indigo-500 text-white px-5 py-2 rounded-full text-sm font-semibold">Semua</button>
                <button data-filter="active" class="filter-btn text-slate-500 hover:text-slate-800 px-5 py-2 rounded-full text-sm font-semibold">Aktif</button>
                <button data-filter="completed" class="filter-btn text-slate-500 hover:text-slate-800 px-5 py-2 rounded-full text-sm font-semibold">Selesai</button>
            </div>
            <div class="relative flex-grow md:max-w-xs w-full">
                <input type="search" id="search-input" class="w-full pl-10 pr-4 py-2 text-sm text-slate-700 bg-white border-transparent border-2 rounded-full focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all shadow-sm" placeholder="Cari rencana..." />
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>
        </div>

        <!-- Daftar Todo -->
        <div class="bg-white rounded-xl shadow-sm">
            <ul id="todo-list">
                <!-- Item Todo akan dirender oleh JavaScript di sini -->
            </ul>
        </div>
        <p id="empty-state" class="hidden text-center text-slate-500 mt-8 py-4">
            Daftar rencanamu masih kosong.
        </p>
    </div>
    
    <!-- Notifikasi Kustom -->
    <div id="toast" class="toast-notification fixed top-5 right-5 bg-red-500 text-white py-2 px-4 rounded-lg shadow-md text-sm font-medium opacity-0">
        <!-- Pesan notifikasi akan muncul di sini -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- ELEMEN DOM ---
            const form = document.getElementById('form-todo');
            const todoInput = document.getElementById('todo-input');
            const submitButton = document.getElementById('submit-button');
            const todoList = document.getElementById('todo-list');
            const filterButtonsContainer = document.getElementById('filter-buttons');
            const searchInput = document.getElementById('search-input');
            const emptyState = document.getElementById('empty-state');
            const toast = document.getElementById('toast');

            // --- STATE APLIKASI ---
            let todos = [];
            let currentFilter = 'all';
            let editingTodoId = null;

            // --- FUNGSI ---

            function showToast(message, isError = true) {
                toast.textContent = message;
                toast.className = `toast-notification fixed top-5 right-5 text-white py-2 px-4 rounded-lg shadow-md text-sm font-medium ${isError ? 'bg-red-500' : 'bg-green-500'}`;
                toast.style.opacity = 1;
                setTimeout(() => {
                    toast.style.opacity = 0;
                }, 3500);
            }

            const saveTodos = () => {
                localStorage.setItem('todos', JSON.stringify(todos));
            };

            const renderTodos = () => {
                const searchTerm = searchInput.value.toLowerCase();
                let filteredTodos = todos.filter(todo => {
                    if (currentFilter === 'active') return !todo.completed;
                    if (currentFilter === 'completed') return todo.completed;
                    return true;
                });

                if (searchTerm) {
                    filteredTodos = filteredTodos.filter(todo =>
                        todo.text.toLowerCase().includes(searchTerm)
                    );
                }

                todoList.innerHTML = '';
                
                const parentContainer = todoList.parentElement;
                if (filteredTodos.length === 0) {
                    emptyState.classList.remove('hidden');
                    parentContainer.classList.add('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    parentContainer.classList.remove('hidden');
                }

                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.setAttribute('data-id', todo.id);
                    li.className = `flex items-center p-4 border-b border-slate-100 transition-all duration-200 group last:border-b-0`;
                    
                    const isEditing = editingTodoId === todo.id;

                    li.innerHTML = `
                        ${isEditing ? `
                            <input type="text" value="${todo.text}" class="edit-input flex-grow text-slate-700 bg-transparent border-b-2 border-indigo-500 focus:outline-none text-base py-1">
                            <button class="save-btn ml-4 text-green-500 hover:text-green-700 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                            </button>
                        ` : `
                            <div class="flex items-center flex-grow cursor-pointer" data-action="toggle">
                                <div class="w-6 h-6 flex-shrink-0 border-2 ${todo.completed ? 'bg-indigo-500 border-indigo-500' : 'border-slate-300'} rounded-full mr-4 flex items-center justify-center transition-all duration-300">
                                    ${todo.completed ? `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>` : ''}
                                </div>
                                <label class="text-base ${todo.completed ? 'line-through text-slate-400' : 'text-slate-700'} transition-all duration-300">${todo.text}</label>
                            </div>
                            <div class="flex items-center space-x-2 ml-4 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="edit-btn text-slate-400 hover:text-indigo-600 transition-colors p-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                                </button>
                                <button class="delete-btn text-slate-400 hover:text-red-600 transition-colors p-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                </button>
                            </div>
                        `}
                    `;
                    todoList.appendChild(li);
                });
            };

            const handleListClick = (e) => {
                const target = e.target;
                const li = target.closest('li');
                if (!li) return;
                
                const todoId = Number(li.dataset.id);

                if (target.closest('.delete-btn')) {
                    todos = todos.filter(todo => todo.id !== todoId);
                    saveTodos();
                    renderTodos();
                }
                
                if (target.closest('.edit-btn')) {
                    editingTodoId = todoId;
                    renderTodos();
                    const input = li.querySelector('.edit-input');
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length);
                }
                
                if (target.closest('.save-btn')) {
                    const newText = li.querySelector('.edit-input').value.trim();
                    if (newText) {
                        const isDuplicate = todos.some(t => t.text.toLowerCase() === newText.toLowerCase() && t.id !== todoId);
                        if (isDuplicate) {
                            showToast('Judul todo ini sudah ada!');
                        } else {
                            const todoToUpdate = todos.find(t => t.id === todoId);
                            todoToUpdate.text = newText;
                            editingTodoId = null;
                            saveTodos();
                            renderTodos();
                        }
                    }
                }

                if (target.closest('[data-action="toggle"]')) {
                    const todoToToggle = todos.find(t => t.id === todoId);
                    todoToToggle.completed = !todoToToggle.completed;
                    saveTodos();
                    renderTodos();
                }
            };
            
            const handleFormSubmit = (e) => {
                e.preventDefault();
                const newTodoText = todoInput.value.trim();

                if (!newTodoText) {
                    showToast('Rencana tidak boleh kosong!');
                    return;
                }

                const isDuplicate = todos.some(todo => todo.text.toLowerCase() === newTodoText.toLowerCase());
                if (isDuplicate) {
                    showToast('Rencana dengan judul ini sudah ada!');
                    return;
                }

                const newTodo = { id: Date.now(), text: newTodoText, completed: false };
                todos.unshift(newTodo);
                saveTodos();
                renderTodos();

                todoInput.value = '';
                todoInput.focus();
            };

            const handleFilterChange = (e) => {
                const target = e.target.closest('.filter-btn');
                if (!target) return;
                
                currentFilter = target.dataset.filter;
                
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('bg-indigo-500', 'text-white');
                    btn.classList.add('text-slate-500', 'hover:text-slate-800');
                });
                target.classList.add('bg-indigo-500', 'text-white');
                target.classList.remove('text-slate-500', 'hover:text-slate-800');
                
                renderTodos();
            };
            
            // --- INISIALISASI ---
            const loadedTodos = localStorage.getItem('todos');
            if (loadedTodos) {
                todos = JSON.parse(loadedTodos);
            }

            form.addEventListener('submit', handleFormSubmit);
            todoList.addEventListener('click', handleListClick);
            filterButtonsContainer.addEventListener('click', handleFilterChange);
            searchInput.addEventListener('input', renderTodos);

            new Sortable(todoList, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: (evt) => {
                    const itemEl = evt.item;
                    const oldIndex = Array.from(todoList.children).indexOf(itemEl);
                    const originalTodo = todos.find(t => t.id == itemEl.dataset.id);
                    
                    let originalIndexInTodos = -1;
                    const currentVisibleTodos = todos.filter(todo => {
                         if (currentFilter === 'active') return !todo.completed;
                         if (currentFilter === 'completed') return todo.completed;
                         return true;
                    });
                    
                    if (evt.oldDraggableIndex != null) {
                         const movedItem = currentVisibleTodos.splice(evt.oldDraggableIndex, 1)[0];
                         currentVisibleTodos.splice(evt.newDraggableIndex, 0, movedItem);
                    }

                    const newOrderedIds = currentVisibleTodos.map(t => t.id);

                    todos.sort((a, b) => {
                        let aIndex = newOrderedIds.indexOf(a.id);
                        let bIndex = newOrderedIds.indexOf(b.id);
                        if (aIndex === -1) aIndex = Infinity;
                        if (bIndex === -1) bIndex = Infinity;
                        return aIndex - bIndex;
                    });

                    saveTodos();
                    renderTodos();
                }
            });

            renderTodos();
        });
    </script>
</body>
</html>
