<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <!-- Bootstrap v5.3 from CDN (since we can't access your vendor files) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css"
    />
    <!-- Sortable.js for drag and drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
      .todo-item {
        cursor: move;
        transition: all 0.2s ease;
      }
      .todo-item:hover {
        background-color: #f8f9fa;
      }
      .todo-item.sortable-ghost {
        opacity: 0.5;
      }
      .todo-item.sortable-drag {
        transform: rotate(5deg);
      }
      .completed-todo {
        text-decoration: line-through;
        color: #6c757d;
      }
      .edit-input {
        border: 2px solid #0d6efd;
        border-radius: 4px;
      }
      .drag-handle {
        cursor: grab;
        color: #6c757d;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1050;
        min-width: 300px;
      }
    </style>
  </head>
  <body>
    <!-- Notification Area -->
    <div id="notificationArea"></div>

    <div class="container mt-5">
      <div>
        <h1 class="mb-4">
          <i class="bi bi-check2-square text-primary"></i>
          Todo List
        </h1>
        <hr />

        <!-- Form -->
        <form id="formData" class="mb-4">
          <div class="mb-3">
            <label for="todoInput" class="form-label">
              <strong>Apa rencana kamu selanjutnya?</strong>
            </label>
            <div class="input-group flex-nowrap">
              <input 
                type="text" 
                class="form-control" 
                name="todo" 
                id="todoInput"
                placeholder="Masukkan todo baru..."
                autocomplete="off"
              />
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus"></i> Tambah
              </button>
            </div>
          </div>
        </form>

        <!-- Filter dan Search -->
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="btn-group" role="group">
              <input type="radio" class="btn-check" name="filter" id="filterAll" value="all" checked>
              <label class="btn btn-outline-secondary" for="filterAll">
                <i class="bi bi-list-ul"></i> Semua
              </label>

              <input type="radio" class="btn-check" name="filter" id="filterCompleted" value="completed">
              <label class="btn btn-outline-success" for="filterCompleted">
                <i class="bi bi-check-circle"></i> Selesai
              </label>

              <input type="radio" class="btn-check" name="filter" id="filterPending" value="pending">
              <label class="btn btn-outline-warning" for="filterPending">
                <i class="bi bi-clock"></i> Belum Selesai
              </label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-search"></i>
              </span>
              <input 
                type="text" 
                class="form-control" 
                id="searchInput" 
                placeholder="Cari todo..."
                autocomplete="off"
              />
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="row mb-3">
          <div class="col">
            <div class="card">
              <div class="card-body py-2">
                <div class="row text-center">
                  <div class="col">
                    <small class="text-muted">Total</small>
                    <div class="fw-bold" id="totalCount">0</div>
                  </div>
                  <div class="col">
                    <small class="text-muted">Selesai</small>
                    <div class="fw-bold text-success" id="completedCount">0</div>
                  </div>
                  <div class="col">
                    <small class="text-muted">Belum Selesai</small>
                    <div class="fw-bold text-warning" id="pendingCount">0</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Todo List -->
        <ul class="list-group" id="todoList">
          <!-- Todos will be rendered here -->
        </ul>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-5 d-none">
          <i class="bi bi-inbox display-1 text-muted"></i>
          <h3 class="text-muted">Tidak ada todo</h3>
          <p class="text-muted">Tambahkan todo pertama Anda!</p>
        </div>
      </div>
    </div>

    <script>
      // Data storage - dalam production, gunakan localStorage
      let todos = [];
      let currentFilter = 'all';
      let currentSearch = '';
      let sortable = null;

      // Initialize on page load
      document.addEventListener("DOMContentLoaded", function () {
        initializeApp();
      });

      function initializeApp() {
        // Load todos from storage (in production, use localStorage)
        loadTodos();
        
        // Setup event listeners
        setupEventListeners();
        
        // Initial render
        renderTodos();
        
        // Setup sortable
        setupSortable();
      }

      function loadTodos() {
        // In production, replace this with:
        // const storedTodos = localStorage.getItem("todos");
        // if (storedTodos) {
        //   todos = JSON.parse(storedTodos);
        // }
        
        // Start with empty todos array
        todos = [];
      }

      function saveTodos() {
        // In production, replace this with:
        // localStorage.setItem("todos", JSON.stringify(todos));
        console.log("Todos saved:", todos);
      }

      function setupEventListeners() {
        // Form submit
        document.getElementById("formData").addEventListener("submit", handleAddTodo);
        
        // Filter buttons
        document.querySelectorAll('input[name="filter"]').forEach(radio => {
          radio.addEventListener('change', handleFilterChange);
        });
        
        // Search input
        document.getElementById("searchInput").addEventListener('input', handleSearch);
      }

      function handleAddTodo(event) {
        event.preventDefault();
        const todoInput = document.getElementById("todoInput");
        const todoText = todoInput.value.trim();

        if (todoText === "") {
          showNotification("Todo tidak boleh kosong!", "warning");
          return;
        }

        // Validasi duplikasi
        const isDuplicate = todos.some(item => 
          item.todo.toLowerCase() === todoText.toLowerCase()
        );

        if (isDuplicate) {
          showNotification("Todo dengan judul yang sama sudah ada!", "danger");
          return;
        }

        // Tambah todo baru
        const newTodo = {
          id: Date.now(),
          todo: todoText,
          completed: false,
          order: todos.length
        };

        todos.unshift(newTodo);
        
        // Update order untuk semua todos
        todos.forEach((item, index) => {
          item.order = index;
        });

        todoInput.value = "";
        saveTodos();
        renderTodos();
        showNotification("Todo berhasil ditambahkan!", "success");
      }

      function handleFilterChange(event) {
        currentFilter = event.target.value;
        renderTodos();
      }

      function handleSearch(event) {
        currentSearch = event.target.value.toLowerCase().trim();
        renderTodos();
      }

      function setupSortable() {
        const todoList = document.getElementById("todoList");
        sortable = Sortable.create(todoList, {
          handle: '.drag-handle',
          animation: 150,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag',
          onEnd: function (evt) {
            const oldIndex = evt.oldIndex;
            const newIndex = evt.newIndex;
            
            if (oldIndex !== newIndex) {
              // Get filtered todos to work with correct indices
              const filteredTodos = getFilteredTodos();
              const movedTodo = filteredTodos[oldIndex];
              
              // Find the actual index in the main todos array
              const actualOldIndex = todos.findIndex(t => t.id === movedTodo.id);
              
              // Remove from old position
              const [removed] = todos.splice(actualOldIndex, 1);
              
              // Find new position in main array
              let actualNewIndex;
              if (newIndex === 0) {
                actualNewIndex = 0;
              } else if (newIndex >= filteredTodos.length - 1) {
                actualNewIndex = todos.length;
              } else {
                const nextTodo = filteredTodos[newIndex];
                actualNewIndex = todos.findIndex(t => t.id === nextTodo.id);
              }
              
              // Insert at new position
              todos.splice(actualNewIndex, 0, removed);
              
              // Update order values
              todos.forEach((item, index) => {
                item.order = index;
              });
              
              saveTodos();
              renderTodos();
              showNotification("Urutan todo berhasil diubah!", "info");
            }
          }
        });
      }

      function getFilteredTodos() {
        let filtered = todos;

        // Apply search filter
        if (currentSearch) {
          filtered = filtered.filter(item =>
            item.todo.toLowerCase().includes(currentSearch)
          );
        }

        // Apply status filter
        if (currentFilter === 'completed') {
          filtered = filtered.filter(item => item.completed);
        } else if (currentFilter === 'pending') {
          filtered = filtered.filter(item => !item.completed);
        }

        return filtered;
      }

      function renderTodos() {
        const todoList = document.getElementById("todoList");
        const emptyState = document.getElementById("emptyState");
        const filteredTodos = getFilteredTodos();

        // Clear current content
        todoList.innerHTML = "";

        if (filteredTodos.length === 0) {
          emptyState.classList.remove("d-none");
          todoList.classList.add("d-none");
        } else {
          emptyState.classList.add("d-none");
          todoList.classList.remove("d-none");

          filteredTodos.forEach((item, index) => {
            const li = createTodoElement(item, index);
            todoList.appendChild(li);
          });
        }

        updateStats();
      }

      function createTodoElement(item, index) {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex align-items-center todo-item";
        li.dataset.todoId = item.id;

        li.innerHTML = `
          <div class="drag-handle me-2">
            <i class="bi bi-grip-vertical"></i>
          </div>
          <div class="flex-fill me-2">
            <input class="form-check-input me-2" type="checkbox" ${item.completed ? 'checked' : ''}>
            <span class="todo-text ${item.completed ? 'completed-todo' : ''}">${escapeHtml(item.todo)}</span>
            <input class="form-control edit-input d-none" type="text" value="${escapeHtml(item.todo)}">
          </div>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-primary edit-btn" title="Edit">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger delete-btn" title="Hapus">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        `;

        // Add event listeners
        const checkbox = li.querySelector('input[type="checkbox"]');
        const editBtn = li.querySelector('.edit-btn');
        const deleteBtn = li.querySelector('.delete-btn');
        const todoText = li.querySelector('.todo-text');
        const editInput = li.querySelector('.edit-input');

        checkbox.addEventListener('change', () => toggleTodo(item.id));
        editBtn.addEventListener('click', () => toggleEdit(item.id, li));
        deleteBtn.addEventListener('click', () => deleteTodo(item.id));
        editInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            saveEdit(item.id, editInput.value, li);
          } else if (e.key === 'Escape') {
            cancelEdit(li);
          }
        });
        editInput.addEventListener('blur', () => {
          saveEdit(item.id, editInput.value, li);
        });

        return li;
      }

      function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          saveTodos();
          renderTodos();
          showNotification(
            todo.completed ? "Todo ditandai selesai!" : "Todo ditandai belum selesai!",
            todo.completed ? "success" : "info"
          );
        }
      }

      function toggleEdit(id, element) {
        const todoText = element.querySelector('.todo-text');
        const editInput = element.querySelector('.edit-input');
        const editBtn = element.querySelector('.edit-btn');

        if (editInput.classList.contains('d-none')) {
          // Start editing
          todoText.classList.add('d-none');
          editInput.classList.remove('d-none');
          editInput.focus();
          editInput.select();
          editBtn.innerHTML = '<i class="bi bi-check"></i>';
        } else {
          // Save edit
          saveEdit(id, editInput.value, element);
        }
      }

      function saveEdit(id, newValue, element) {
        const todo = todos.find(t => t.id === id);
        const trimmedValue = newValue.trim();

        if (trimmedValue === "") {
          showNotification("Todo tidak boleh kosong!", "warning");
          cancelEdit(element);
          return;
        }

        // Check for duplicates (excluding current todo)
        const isDuplicate = todos.some(item => 
          item.id !== id && item.todo.toLowerCase() === trimmedValue.toLowerCase()
        );

        if (isDuplicate) {
          showNotification("Todo dengan judul yang sama sudah ada!", "danger");
          cancelEdit(element);
          return;
        }

        if (todo && todo.todo !== trimmedValue) {
          todo.todo = trimmedValue;
          saveTodos();
          renderTodos();
          showNotification("Todo berhasil diperbarui!", "success");
        } else {
          cancelEdit(element);
        }
      }

      function cancelEdit(element) {
        const todoText = element.querySelector('.todo-text');
        const editInput = element.querySelector('.edit-input');
        const editBtn = element.querySelector('.edit-btn');

        todoText.classList.remove('d-none');
        editInput.classList.add('d-none');
        editBtn.innerHTML = '<i class="bi bi-pencil"></i>';
      }

      function deleteTodo(id) {
        if (confirm("Apakah Anda yakin ingin menghapus todo ini?")) {
          const index = todos.findIndex(t => t.id === id);
          if (index !== -1) {
            const deletedTodo = todos.splice(index, 1)[0];
            
            // Update order untuk todos yang tersisa
            todos.forEach((item, index) => {
              item.order = index;
            });
            
            saveTodos();
            renderTodos();
            showNotification("Todo berhasil dihapus!", "success");
          }
        }
      }

      function updateStats() {
        const total = todos.length;
        const completed = todos.filter(t => t.completed).length;
        const pending = total - completed;

        document.getElementById("totalCount").textContent = total;
        document.getElementById("completedCount").textContent = completed;
        document.getElementById("pendingCount").textContent = pending;
      }

      function showNotification(message, type = 'info') {
        const notificationArea = document.getElementById('notificationArea');
        const notification = document.createElement('div');
        
        const alertClass = {
          'success': 'alert-success',
          'danger': 'alert-danger',
          'warning': 'alert-warning',
          'info': 'alert-info'
        }[type] || 'alert-info';

        const icon = {
          'success': 'bi-check-circle',
          'danger': 'bi-exclamation-triangle',
          'warning': 'bi-exclamation-circle',
          'info': 'bi-info-circle'
        }[type] || 'bi-info-circle';
        
        notification.className = `alert ${alertClass} alert-dismissible notification`;
        notification.innerHTML = `
          <i class="bi ${icon} me-2"></i>
          ${escapeHtml(message)}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        notificationArea.appendChild(notification);
        
        // Auto remove after 5 seconds
        setTimeout(() => {
          if (notification.parentNode) {
            notification.remove();
          }
        }, 5000);
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Save on page unload (in production)
      window.addEventListener("beforeunload", () => {
        saveTodos();
      });
    </script>
  </body>
</html>
